<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Приглашение</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--ivory:#FBF7F0;--champ:#F1E8D8;--gold:#B8975A;--rose:#D9B8B0;--ink:#4A3F35;--soft:#8A7B6C}
html{scroll-behavior:smooth}
body{margin:0;background:#E9E0D0;font-family:'Montserrat',sans-serif;font-weight:300;color:var(--ink)}
.app{max-width:480px;margin:0 auto;background:var(--ivory);min-height:100vh;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(74,63,53,.12)}
.serif{font-family:'Cormorant Garamond',serif}
h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:2.1rem;text-align:center;letter-spacing:.02em}
section{padding:64px 28px 8px}
.rule{width:56px;height:1px;background:var(--gold);margin:14px auto 28px}
.lock{overflow:hidden;height:100vh}

/* Scroll reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}

/* Hero & envelope */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;background:radial-gradient(circle at 50% 0%,#fff 0%,var(--champ) 100%)}
.names{font-family:'Cormorant Garamond',serif;font-size:3.2rem;line-height:1.05;font-weight:500}
.names i{display:block;font-size:1.6rem;color:var(--gold);font-weight:400;margin:4px 0}
.env{position:relative;width:290px;height:190px;margin:34px auto 28px;perspective:900px}
.env .back{position:absolute;inset:0;background:#E7D6BF;border-radius:6px;box-shadow:0 18px 40px rgba(74,63,53,.18)}
.env .letter{position:absolute;left:14px;right:14px;top:10px;height:150px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;color:var(--gold);transition:transform .9s .5s ease}
.env .front{position:absolute;inset:0;background:linear-gradient(135deg,#F1E3CD 50%,transparent 50%),linear-gradient(225deg,#EADBC3 50%,transparent 50%);border-radius:6px;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:105px;background:#DCC9AC;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease .25s,z-index 0s .5s;z-index:3}
.env .seal{position:absolute;left:50%;top:84px;width:46px;height:46px;margin-left:-23px;border-radius:50%;z-index:4;display:flex;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle at 35% 30%,#D7B97C,#9C7B3F);box-shadow:0 4px 10px rgba(0,0,0,.25);transition:transform .6s ease,opacity .5s ease}
.env.open .seal{transform:translateY(40px) scale(.6) rotate(40deg);opacity:0}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .letter{transform:translateY(-46px)}
.btn{display:inline-block;border:1px solid var(--gold);color:var(--ink);background:transparent;padding:14px 34px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;border-radius:999px;transition:all .3s;cursor:pointer;font-family:inherit}
.btn:hover,.btn:active{background:var(--gold);color:#fff}
.btn.solid{background:var(--gold);color:#fff}

/* Countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd div{background:var(--champ);border-radius:14px;padding:16px 4px;text-align:center}
.cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:500;color:var(--gold);line-height:1}
.cd span{font-size:.62rem;letter-spacing:.12em;color:var(--soft)}

/* Timeline */
.tl{position:relative;padding-left:0}
.tl:before{content:"";position:absolute;left:27px;top:10px;bottom:10px;width:1px;background:var(--rose)}
.tl li{display:flex;align-items:center;gap:20px;margin-bottom:26px;list-style:none}
.tl .ic{flex:none;width:55px;height:55px;border-radius:50%;background:var(--ivory);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);position:relative;z-index:1}
.tl .t{font-family:'Cormorant Garamond',serif;font-size:1.7rem;line-height:1;font-weight:500}
.tl .d{font-size:.85rem;color:var(--soft);margin-top:3px}

/* Dress code */
.pal{display:flex;justify-content:center;gap:14px;margin-top:22px}
.pal i{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(74,63,53,.12),0 4px 10px rgba(74,63,53,.12)}

/* Form */
.card{background:var(--champ);border-radius:20px;padding:26px 22px}
.lbl{display:block;font-size:.78rem;color:var(--soft);margin:20px 0 10px}
.inp{width:100%;background:#fff;border:1px solid #E3D6C1;border-radius:12px;padding:14px;font:inherit;font-size:.95rem;outline:none;color:var(--ink)}
.inp:focus{border-color:var(--gold)}
.opt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E3D6C1;border-radius:12px;padding:13px 14px;margin-bottom:8px;font-size:.9rem;cursor:pointer;transition:border-color .2s}
.opt:has(input:checked){border-color:var(--gold);background:#FFFBF2}
.opt input{accent-color:var(--gold);width:18px;height:18px}
.drinks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drinks .opt{margin:0}

/* Music button */
#music{position:fixed;right:max(16px,calc(50% - 224px));bottom:20px;z-index:50;width:48px;height:48px;border-radius:50%;background:rgba(251,247,240,.92);border:1px solid var(--gold);color:var(--gold);display:none;align-items:center;justify-content:center;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(74,63,53,.18);cursor:pointer}
#music.on{display:flex}
#music.play svg{animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}

/* Toast */
#toast{position:fixed;left:50%;top:24px;transform:translate(-50%,-140%);z-index:100;width:calc(100% - 40px);max-width:400px;background:var(--ink);color:#fff;border-radius:16px;padding:16px 20px;display:flex;gap:12px;align-items:center;font-size:.9rem;transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}*{animation:none!important}}
</style><style>.c{text-align:center}.soft{color:var(--soft)}.eyebrow{font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--soft);margin:0}
.names{overflow-wrap:anywhere}.ttl{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;color:var(--gold);margin:10px 0 0}
.card .btn{width:100%}</style>
<style>
.btn.solid,.btn:hover{color:var(--ivory)}
.inp,.opt{background:var(--paper)!important;border-color:var(--line)!important;color:var(--ink)}
.opt:has(input:checked){background:var(--champ)!important}.env .letter{background:var(--paper)}
#hero{background:radial-gradient(circle at 50% 0%,var(--h1) 0%,var(--h2) 100%)}
.orn{display:none;position:absolute;left:0;right:0;top:0;height:28px;opacity:.5;background:repeating-linear-gradient(135deg,var(--gold) 0 2px,transparent 2px 10px),repeating-linear-gradient(45deg,var(--gold) 0 2px,transparent 2px 10px)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:320px;margin:0 auto;font-size:.85rem}
.cal b{font-weight:500;color:var(--soft);font-size:.72rem}.cal span{padding:7px 0;border-radius:50%}
.cal .hit{background:var(--gold);color:var(--ivory);font-weight:500}
.wish{background:var(--champ);border-radius:16px;padding:14px 16px;margin-bottom:10px}.wish p{margin:0 0 6px;line-height:1.6}.wish small{color:var(--soft)}
</style>
</head>
<body>
<div class="app lock" id="app">
  <header id="hero" style="position:relative"><div class="orn" id="orn"></div>
    <p class="eyebrow" id="catTxt"></p>
    <h1 class="names" id="namesTxt" style="margin-top:20px"></h1>
    <p class="ttl" id="titleTxt"></p>
    <div class="rule" style="margin:18px auto"></div>
    <p class="serif" style="font-size:1.5rem;margin:0" id="dateTxt"></p>
    <p class="soft" style="margin:4px 0 0" id="cityTxt"></p>
    <div class="env" id="env"><div class="back"></div><div class="letter">&#9825;</div><div class="front"></div><div class="flap"></div>
      <div class="seal"><i data-lucide="heart" style="width:20px;height:20px"></i></div></div>
    <button class="btn" id="openBtn"></button>
  </header>
  <main id="main" style="padding-bottom:90px">
    <section class="rv c"><p class="serif" style="font-size:1.5rem;margin:0" id="greet"></p>
      <p class="serif" style="font-size:1.05rem;line-height:1.6;letter-spacing:.04em;margin:14px 0 0;font-weight:600" id="salutTxt"></p>
      <p class="soft" style="white-space:pre-line;line-height:1.9;margin-top:14px" id="bodyTxt"></p>
      <p class="serif" style="font-style:italic;color:var(--gold);font-size:1.3rem;margin-top:18px" id="hostsTxt"></p></section>
    <section class="rv c"><h2 id="calTitle" style="text-transform:capitalize"></h2><div class="rule"></div>
      <div class="cal" id="cal"></div>
      <p class="serif" style="font-size:1.6rem;margin:18px 0 0"><span data-t="start"></span> <span id="timeTxt"></span></p></section>
    <section class="rv"><h2 data-t="cd"></h2><div class="rule"></div>
      <div class="cd"><div><b id="d">0</b><span data-t="d"></span></div><div><b id="h">0</b><span data-t="h"></span></div>
      <div><b id="m">0</b><span data-t="m"></span></div><div><b id="s">0</b><span data-t="s"></span></div></div></section>
    <section class="rv c" id="placeSec"><h2 data-t="place"></h2><div class="rule"></div>
      <p class="serif" style="font-size:1.6rem;margin:0" id="venue"></p><p class="soft" id="addr"></p>
      <a class="btn" id="mapBtn" target="_blank" rel="noopener" style="margin-top:14px"></a></section>
    <section class="rv"><h2 data-t="rsvp"></h2><div class="rule"></div>
      <form class="card" id="rsvp">
        <label class="lbl" style="margin-top:0" for="name" data-t="name"></label><input id="name" name="name" class="inp" required>
        <span class="lbl" data-t="status"></span>
        <label class="opt"><input type="radio" name="status" value="yes" checked><span data-t="yes"></span></label>
        <label class="opt"><input type="radio" name="status" value="plus"><span data-t="plus"></span></label>
        <label class="opt"><input type="radio" name="status" value="no"><span data-t="no"></span></label>
        <span class="lbl" data-t="drinks"></span>
        <div class="drinks">
          <label class="opt"><input type="checkbox" name="drink" data-v="wine"><span data-t="wine"></span></label>
          <label class="opt"><input type="checkbox" name="drink" data-v="whisky"><span data-t="whisky"></span></label>
          <label class="opt"><input type="checkbox" name="drink" data-v="cognac"><span data-t="cognac"></span></label>
          <label class="opt"><input type="checkbox" name="drink" data-v="soft"><span data-t="soft"></span></label>
        </div>
        <button type="submit" id="sendBtn" class="btn solid" style="margin-top:22px"></button>
      </form></section>
    <section class="rv"><h2 data-t="wishH"></h2><div class="rule"></div>
      <div id="wishList"></div>
      <form class="card" id="wishForm" style="margin-top:14px"><input class="inp" id="wName" required maxlength="60">
        <textarea class="inp" id="wText" rows="3" required maxlength="400" style="margin-top:10px"></textarea>
        <button type="submit" class="btn solid" id="wBtn" style="margin-top:12px"></button></form></section>
  </main>
  <button id="music" aria-label="Music"><i data-lucide="music"></i></button>
  <audio id="bgm" loop preload="auto"></audio>
</div>
<div id="toast" role="status"><i data-lucide="check-circle-2"></i><span id="toastText"></span></div>
<script src="/i18n.js"></script>
<script>
lucide.createIcons();
const $ = id => document.getElementById(id);
const [, , SLUG, GTOK = ''] = location.pathname.split('/');
let GUEST = null, target = 0, t = T.ru;

/* Музыка: положите файл music.mp3 в папку public */
const bgm = $('bgm'), mBtn = $('music');
bgm.src = '/music.mp3'; bgm.volume = .6;
function setPlayUI(p){ mBtn.classList.toggle('play', p); mBtn.innerHTML = `<i data-lucide="${p ? 'volume-2' : 'volume-x'}"></i>`; lucide.createIcons(); }
mBtn.onclick = () => bgm.paused ? bgm.play().then(() => setPlayUI(true)).catch(() => {}) : (bgm.pause(), setPlayUI(false));
$('openBtn').onclick = () => {
  $('env').classList.add('open'); $('openBtn').style.visibility = 'hidden';
  bgm.play().then(() => setPlayUI(true)).catch(() => setPlayUI(false));
  mBtn.classList.add('on');
  setTimeout(() => { $('app').classList.remove('lock'); $('main').scrollIntoView({behavior:'smooth'}); }, 1700);
};

function tick(){
  const diff = Math.max(0, target - Date.now()), p = n => String(n).padStart(2, '0');
  $('d').textContent = Math.floor(diff / 864e5); $('h').textContent = p(Math.floor(diff % 864e5 / 36e5));
  $('m').textContent = p(Math.floor(diff % 36e5 / 6e4)); $('s').textContent = p(Math.floor(diff % 6e4 / 1e3));
}
setInterval(tick, 1000);
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rv').forEach(el => io.observe(el));
let tt; function toast(msg, ok = true){ $('toastText').textContent = msg; $('toast').style.background = ok ? 'var(--ink)' : '#9B3B3B';
  $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 4200); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function calendar(dt){
  const [Y, M, D] = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Almaty', year:'numeric', month:'2-digit', day:'2-digit'}).format(dt).split('-').map(Number);
  const off = (new Date(Date.UTC(Y, M - 1, 1)).getUTCDay() + 6) % 7, days = new Date(Date.UTC(Y, M, 0)).getUTCDate();
  let h = [...Array(7)].map((_, i) => `<b>${new Date(Date.UTC(2024, 0, 1 + i)).toLocaleDateString(t.loc, {weekday:'short', timeZone:'UTC'})}</b>`).join('') + '<span></span>'.repeat(off);
  for(let i = 1; i <= days; i++) h += `<span class="${i == D ? 'hit' : ''}">${i}</span>`;
  $('cal').innerHTML = h;
  $('calTitle').textContent = new Date(Date.UTC(Y, M - 1, 1)).toLocaleDateString(t.loc, {month:'long', year:'numeric', timeZone:'UTC'});
}
async function loadWishes(){
  const r = await fetch(`/api/public/${SLUG}/wishes`).then(r => r.json()).catch(() => []);
  $('wishList').innerHTML = r.length ? r.map(w => `<div class="wish"><p>${esc(w.text)}</p><small>${esc(w.name)}</small></div>`).join('') : `<p class="soft c">${t.wishEmpty}</p>`;
}
$('wishForm').onsubmit = async ev => {
  ev.preventDefault(); const b = $('wBtn'); b.disabled = true;
  try{
    const r = await fetch(`/api/public/${SLUG}/wishes`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: $('wName').value, text: $('wText').value})});
    if(!r.ok) throw 0; toast(t.wishOk); $('wText').value = ''; if(!GUEST) $('wName').value = ''; loadWishes();
  }catch{ toast(t.fail, false); } finally{ b.disabled = false; }
};
function fill(d, g){
  t = T[d.lang] || T.ru; document.documentElement.lang = d.lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll('[data-v]').forEach(i => i.value = t[i.dataset.v]);
  $('openBtn').textContent = t.open; $('sendBtn').textContent = t.send; $('name').placeholder = t.namePh;
  const cat = catName(d.category, d.lang);
  document.title = `${d.names}: ${cat}`;
  $('catTxt').textContent = cat; $('namesTxt').textContent = d.names; $('titleTxt').textContent = d.title;
  const dt = new Date(d.date + ':00+05:00'); target = dt.getTime();
  const tz = {timeZone: 'Asia/Almaty'};
  $('dateTxt').textContent = dt.toLocaleDateString(t.loc, {day:'numeric', month:'long', year:'numeric', ...tz}) + ', ' + dt.toLocaleTimeString(t.loc, {hour:'2-digit', minute:'2-digit', hour12:false, ...tz});
  $('cityTxt').textContent = d.city; $('venue').textContent = d.venue; $('addr').textContent = [d.city, d.address].filter(Boolean).join(', ');
  $('bodyTxt').textContent = d.text; $('salutTxt').textContent = d.salut || '';
  $('hostsTxt').textContent = d.hosts ? `${t.hostsL} ${d.hosts}` : '';
  $('timeTxt').textContent = d.date.split('T')[1] || '';
  $('wName').placeholder = t.name; $('wText').placeholder = t.wishPh; $('wBtn').textContent = t.wishBtn;
  const th = THEMES[d.tpl] || THEMES[1], rs = document.documentElement.style;
  Object.entries({'--ivory': th.bg, '--champ': th.champ, '--gold': th.gold, '--ink': th.ink, '--soft': th.soft, '--line': th.line, '--paper': th.paper, '--h1': th.h1, '--h2': th.h2}).forEach(([k, v]) => rs.setProperty(k, v));
  $('orn').style.display = d.tpl == '4' ? 'block' : 'none';
  calendar(dt); loadWishes();
  const q = encodeURIComponent(`${d.city} ${d.address}`);
  $('mapBtn').textContent = t.map; $('mapBtn').href = d.map_url || 'https://2gis.kz/search/' + q;
  if(!d.venue && !d.address && !d.map_url) $('placeSec').remove();
  if(g){ GUEST = g; $('wName').value = g.name; $('greet').textContent = t.dear.replace('{n}', g.name); $('name').value = g.name; $('name').readOnly = true; }
  tick();
}
fetch(`/api/public/${SLUG}?g=${GTOK}`).then(r => r.ok ? r.json() : Promise.reject())
  .then(j => fill(j.data, j.guest))
  .catch(() => document.body.innerHTML = '<p style="padding:60px 24px;text-align:center;font-family:sans-serif">Not found / Табылмады / Не найдено</p>');

$('rsvp').onsubmit = async ev => {
  ev.preventDefault();
  const f = ev.target, btn = $('sendBtn'); btn.disabled = true; btn.textContent = t.sending;
  try{
    const r = await fetch(`/api/public/${SLUG}/rsvp`, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({g: GTOK, name: f.name.value.trim(), status: f.status.value,
        drinks: [...f.querySelectorAll('input[name=drink]:checked')].map(i => i.value)})});
    if(!r.ok) throw 0;
    toast(t.thanks); if(!GUEST) f.reset();
  }catch{ toast(t.fail, false); }
  finally{ btn.disabled = false; btn.textContent = t.send; }
};
</script>
</body>
</html>
